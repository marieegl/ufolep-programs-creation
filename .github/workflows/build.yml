name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed by the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v5

      - run: npm ci

      # The catalog is committed so the app builds without Python, but it is derived from
      # the CSVs and the rules. Rebuilding it here and diffing proves the checked-in copy
      # is still what they produce — otherwise an edited CSV would go unnoticed until the
      # next person ran `npm run data` and got an unexplained diff.
      - run: npm run data
      - run: git diff --exit-code -- src/data/catalog.json data/csv/criteres-elements.csv

      - run: npm run typecheck
      - run: npm run test
      - run: npx vite build

      # The single file, downloadable from the run page: what a coach without GitHub gets.
      - uses: actions/upload-artifact@v4
        with:
          name: note-de-depart
          path: dist/index.html

      # The whole dist (page + manifest + service worker + icons) for the Pages deploy.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Publish to GitHub Pages on pushes to main. Enable once in the repo:
  # Settings → Pages → Build and deployment → Source: GitHub Actions.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
